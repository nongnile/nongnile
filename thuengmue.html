<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThuengMue ถึงมือ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ef;--card:#fff;--tx:#14202b;--mut:#5b6b78;--pri:#1a5280;--on:#fff;--bd:#d9e2ea;--red:#d6372f;--grn:#1f9d55;--blu:#2b7bd0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--card:#192633;--tx:#eaf1f7;--mut:#9fb2c2;--pri:#5aa6e6;--on:#0b1620;--bd:#2a3b4a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Noto Sans Thai",sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 12px}
h1{font-size:19px;margin:0;flex:1;color:var(--pri)}h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
button,input,select{font:inherit;color:inherit}
.btn{border:0;background:var(--pri);color:var(--on);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ok{background:var(--grn);color:#fff}
.tabs{display:flex;gap:6px;padding:0 12px 8px}.tabs .btn{flex:1}
main{padding:0 12px 24px;max-width:720px;margin:auto}
.mw{position:relative}.map{overflow:auto;display:flex;height:clamp(240px,50vh,380px);border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.zb button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px #0004}
.in{position:relative;flex:none;margin:auto;width:100%;aspect-ratio:2244/932;cursor:crosshair}
.in img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0007;display:grid;place-items:center;font-size:12px;color:#fff;padding:0}
.pin.wait{background:var(--blu)}.pin.elder{background:var(--red)}.pin.near{background:#e89b0c;animation:p 1s infinite}.pin.done{background:var(--grn)}
.pin.mine{outline:3px solid #fff;outline-offset:1px}
@keyframes p{50%{transform:scale(1.3)}}
.team{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:#000;border:3px solid #ffd400;font-size:11px;display:grid;place-items:center}
.rad{position:absolute;width:66.7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #e89b0c;background:#e89b0c22;pointer-events:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.card h2{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}.chk input{width:20px;height:20px}
.row{display:flex;gap:8px;margin-top:10px}.row .btn{flex:1}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.li:first-of-type{border:0}
.li div{flex:1;min-width:0}.li small{color:var(--mut);display:block}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#e89b0c;color:#000;padding:14px;border-radius:12px;font-weight:600;display:none;z-index:9;box-shadow:0 4px 16px #0006}
.hint{font-size:13px;color:var(--mut);margin:6px 2px}
</style></head><body>

function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
document.addEventListener("pointerdown",audio,{once:true});
function beep(){try{audio();const o=AC.createOscillator();o.frequency.value=880;o.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)}catch(e){}}
function speak(){try{const u=new SpeechSynthesisUtterance(t().say);u.lang=L=="th"?"th-TH":"en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function check(){let c=false;hs.forEach(h=>{if(h.s=="wait"&&dist(h,team)<=500){h.s="near";c=true;if(h.mine){beep();speak();try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}toast("🔔 "+t().alert)}}});if(c)save();return c}
function draw(){const i=$("in");i.querySelectorAll(".pin,.team,.rad").forEach(n=>n.remove());let o="";
hs.forEach(h=>{const c=h.s=="wait"&&h.e?"elder":h.s;o+=`<button class="pin ${c} ${h.mine?"mine":""}" data-id="${esc(h.id)}" aria-label="${esc(h.name)}" style="left:${h.x}%;top:${h.y}%">${h.s=="done"?"✓":h.e?"♥":""}</button>`});
if(draft&&draft.x!=null)o+=`<div class="pin elder" style="left:${draft.x}%;top:${draft.y}%">📍</div>`;
o+=`<div class="rad"></div><div class="team">🚤</div>`;i.insertAdjacentHTML("beforeend",o);placeTeam();
$("lg").innerHTML=t().lg.map((x,k)=>`<span><i style="background:${["var(--red)","var(--blu)","#e89b0c","var(--grn)"][k]}"></i>${x}</span>`).join("");
$("sub").textContent=t().sub;$("tR").textContent=t().res;$("tV").textContent=t().vol;$("lang").textContent=L=="th"?"EN":"TH";document.documentElement.lang=L;
$("tR").className="btn"+(mode=="R"?"":" alt");$("tV").className="btn"+(mode=="V"?"":" alt");$("pR").hidden=mode!="R";$("pV").hidden=mode!="V";panels()}
function placeTeam(){document.querySelectorAll(".team,.rad").forEach(n=>{n.style.left=team.x+"%";n.style.top=team.y+"%"})}
function panels(){const x=t(),me=hs.find(h=>h.mine);
const stc=`<h2>${x.st}</h2>${me?`<b>${esc(me.name)}</b> · ${x.fl} ${esc(me.fl)}<br><span class="tag" style="background:${{wait:"var(--blu)",near:"#e89b0c",done:"var(--grn)"}[me.s]}">${x.s[me.s]}</span>`:x.none}`;
if(mode=="R"){const f=document.activeElement;if($("stc")&&f&&f.closest&&f.closest("#fm")){$("stc").innerHTML=stc;return}
const d=draft||{};$("pR").innerHTML=`<div class="card" id="fm"><h2>📍 ${x.reg}</h2><div class="hint">${x.tap}</div>
<label>${x.name}</label><input type="text" id="fn" maxlength="60" value="${esc(d.n||"")}"><label>${x.floor}</label><input type="text" id="ff" maxlength="4" inputmode="numeric" value="${esc(d.f||"")}">
<label class="chk"><input type="checkbox" id="fe" ${d.e?"checked":""}>${x.eld}</label><div class="row"><button class="btn" id="sv">${x.save}</button></div></div><div class="card" id="stc">${stc}</div>`;return}
const q=[...hs].sort((a,b)=>(b.e-a.e)||dist(a,team)-dist(b,team)).filter(h=>h.s!="done"),dn=hs.filter(h=>h.s=="done");
const li=h=>`<div class="li"><div><b>${h.e?"♥ ":""}${esc(h.name)}</b><small>${x.fl} ${esc(h.fl)} · <span data-dd="${esc(h.id)}">${dist(h,team)}</span> ${x.m}${h.s=="near"?" · 🔔 "+x.near:""}</small></div>${h.s=="done"?`<span class="tag" style="background:var(--grn)">${x.dn}</span>`:`<button class="btn ok" data-d="${esc(h.id)}" aria-label="done">✔</button>`}</div>`;
$("pV").innerHTML=`<div class="row"><button class="btn" id="dm">${timer?x.stop:x.demo}</button></div><div class="hint">${x.hint}</div><div class="card"><h2>${x.q} (${q.length})</h2>${q.map(li).join("")}${dn.map(li).join("")}</div><div class="row"><button class="btn alt" id="rs">${x.reset}</button></div>`}
function dd(){document.querySelectorAll("[data-dd]").forEach(s=>{const h=hs.find(h=>String(h.id)==s.dataset.dd);if(h)s.textContent=dist(h,team)})}
$("in").addEventListener("click",e=>{const p=e.target.closest(".pin[data-id]"),r=$("in").getBoundingClientRect();if(!r.width)return;
const pt={x:+clamp((e.clientX-r.left)/r.width*100,0,100).toFixed(1),y:+clamp((e.clientY-r.top)/r.height*100,0,100).toFixed(1)};
if(p){const h=hs.find(h=>String(h.id)==p.dataset.id);if(h)toast((h.e?"♥ ":"")+h.name+" · "+t().fl+" "+h.fl+" · "+dist(h,team)+" "+t().m);return}
if(mode=="R")draft={...draft,...pt};else{team=pt;check()}draw()});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b)return;
if(b.id=="sv"){if(!draft||draft.x==null){toast(t().nopin);return}
hs=hs.filter(h=>!h.mine);hs.push({id:"me"+Date.now(),name:($("fn").value.trim()||t().home).slice(0,60),fl:($("ff").value.trim()||"1").slice(0,4),x:draft.x,y:draft.y,e:$("fe").checked?1:0,s:"wait",mine:1});draft=null;check();save();draw()}
else if(b.dataset.d){const h=hs.find(h=>String(h.id)==b.dataset.d);if(h){h.s="done";save();draw()}}
else if(b.id=="dm"){if(timer)stop();else run();draw()}
else if(b.id=="rs"){stop();hs=seed();team={x:8,y:80};draft=null;save();draw()}});
document.addEventListener("input",e=>{if(["fn","ff","fe"].includes(e.target.id))draft={...draft,n:$("fn").value,f:$("ff").value,e:$("fe").checked}});
function stop(){clearInterval(timer);timer=null}
function run(){stop();const wp=[[8,80],[7,62],[20,66],[23,60],[31,52],[42,30],[62,60],[62,84],[80,55]];let i=0;team={x:wp[0][0],y:wp[0][1]};
timer=setInterval(()=>{try{const g=wp[i+1];if(!g){stop();draw();return}
const dx=g[0]-team.x,dy=g[1]-team.y,d=Math.hypot(dx,dy);if(d<1.2){i++;return}team.x+=dx/d*1.1;team.y+=dy/d*1.1;placeTeam();
if(check())draw();else dd();
const m=$("map"),n=$("in");m.scrollLeft=team.x/100*n.offsetWidth-m.clientWidth/2;m.scrollTop=team.y/100*n.offsetHeight-m.clientHeight/2}catch(e){stop()}},120)}
const fit=()=>{$("in").style.width=$("map").clientWidth*Z+"px"};
function zoom(z){const m=$("map"),cx=(m.scrollLeft+m.clientWidth/2)/m.scrollWidth,cy=(m.scrollTop+m.clientHeight/2)/m.scrollHeight;Z=clamp(z,1,4);fit();m.scrollLeft=cx*m.scrollWidth-m.clientWidth/2;m.scrollTop=cy*m.scrollHeight-m.clientHeight/2}
$("zi").onclick=()=>zoom(Z*1.4);$("zo").onclick=()=>zoom(Z/1.4);$("zr").onclick=()=>zoom(1);
$("lang").onclick=()=>{L=L=="th"?"en":"th";st.set("tm_l",L);draw()};
$("tR").onclick=()=>{mode="R";draw()};$("tV").onclick=()=>{mode="V";draw()};
addEventListener("resize",fit);addEventListener("error",()=>toast(t().err));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&timer){stop();draw()}});
fit();draw();
</script></body></html>
